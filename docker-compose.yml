services:
  mysql:
    image: mysql:8.0
    container_name: envio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 39166011
      MYSQL_DATABASE: enviorapidoapi
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: envio-rapido:1.0
    container_name: envio-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/enviorapidoapi?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 39166011
    depends_on:
      - mysql
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Aguardando MySQL estar pronto..."
        while ! nc -z mysql 3306; do
          echo "MySQL ainda não está pronto - aguardando..."
          sleep 2
        done
        echo "MySQL está pronto! Iniciando aplicação..."
        java -jar /app/app.jar
    restart: on-failure

volumes:
  mysql_data: